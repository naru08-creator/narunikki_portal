    const categories = item.categories || [];
    const isGame = categories.some(c => c.includes('ポケモン'));
    const isTravel = categories.some(c => c.includes('遠征'));
    const isOshi = categories.some(c => c.includes('推し活'));
    const isCreator = categories.some(c => c.includes('制作ログ'));
    const isRecommend = categories.some(c => c.includes('おすすめ'));

    let color = 'var(--window-yellow)';
    if (isGame) color = 'var(--window-green)';
    else if (isTravel || isOshi) color = 'var(--window-purple)';
    else if (isCreator) color = 'var(--window-pink)';
    else if (isRecommend) color = 'var(--window-blue)';
    const tag =
      item.isAd ? 'PR' :
       item.isRecommend ? 'おすすめ' :
      item.isPopular ? '★人気' :
      (categories[0] || 'DIARY');

grid.insertAdjacentHTML('beforeend', `
  <div
    class="window-card ${item.isRecommend ? 'recommend-card' : ''}"
    ${item.isRecommend ? `onclick="openRecommendModal(${JSON.stringify(item).replace(/"/g, '&quot;')})"` : ''}
  >
    <div class="window-bar" style="background:${color}">
      <div class="dot"></div><div class="dot"></div><div class="dot"></div>
    </div>

    <div class="img-space">
      <img
        src="${item.image}"
        alt="${item.title}"
        loading="lazy"
        decoding="async"
        onerror="this.onerror=null;this.src='NoImage.png'"
      >
    </div>

    <div class="txt-space">
      <span class="badge" style="background:${color}">${tag}</span>
      <h3>${item.title}</h3>
    </div>
  </div>
`);
  });
}

// ===== フィルタ =====
function filterByKeyword(keyword, btn) {
  const recommendSubnav = document.getElementById('recommend-subnav');

  // おすすめタブのときだけ小カテゴリーを表示
  if (recommendSubnav) {
    recommendSubnav.style.display =
      keyword === 'おすすめ' ? 'flex' : 'none';
  }

  if (btn) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  }

  let filtered = [];

  if (keyword === 'all') {
    filtered = [...allArticles];

  } else if (keyword === '制作ログ') {
    filtered = [...noteArticles];

  } else if (keyword === 'おすすめ') {
    filtered = [...recommendItems];

  } else {
    filtered = allArticles.filter(item =>
      item.categories && item.categories.some(c => c.includes(keyword))
    );
  }

  // ⭐ 最新（all）の時の処理
  if (keyword === 'all') {
    filtered = insertPopular(filtered);

    if (filtered.length >= 2) {
      filtered.splice(1, 0, nintendoOnlineAd[0]);
    }

    if (filtered.length >= 5) {
      filtered.splice(4, 0, netOffAd[0]);
    }
  }

  // ⭐ ポケモンタブの時の処理
  if (keyword === 'ポケモン') {
    filtered = insertPopular(filtered);
    filtered = insertAfterFirst(filtered, toolCards);
    filtered.splice(0, 0, nintendoOnlineAd[0]);
  }

  // ⭐ その他のタブ
  if (keyword === '遠征') {
    filtered = insertAfterFirst(filtered, travelAds);
  }

  if (keyword === '推し活') {
    filtered = insertAfterFirst(filtered, oshiAds);
  }

  render(filtered);
}

// ===== おすすめ小カテゴリー =====
function filterRecommend(keyword, btn) {
  document.querySelectorAll('.recommend-sub-btn').forEach(b => {
    b.classList.remove('active');
  });

  btn.classList.add('active');

  let filtered;

  if (keyword === 'all') {
    filtered = [...recommendItems];
  } else {
    filtered = recommendItems.filter(item =>
      item.categories && item.categories.includes(keyword)
    );
  }

  render(filtered);
}

function openRecommendModal(item) {
  document.getElementById('recommend-modal-img').src = item.image;
  document.getElementById('recommend-modal-img').alt = item.title;
  document.getElementById('recommend-modal-title').textContent = item.title;
  document.getElementById('recommend-modal-description').textContent =
    item.details || '';

  // アフィリエイト表記
  const pr = document.getElementById('recommend-modal-pr');
  pr.style.display = item.isAffiliate ? 'block' : 'none';

  // 購入リンク
  const links = document.getElementById('recommend-modal-links');

  if (item.shopLinks && item.shopLinks.length > 0) {
    links.innerHTML = item.shopLinks.map(shop => `
      <a
        href="${shop.url}"
        target="_blank"
        rel="noopener noreferrer"
        class="recommend-shop-btn"
      >
        ${shop.label}
      </a>
    `).join('');
  } else if (item.link) {
    links.innerHTML = `
      <a
        href="${item.link}"
        target="_blank"
        rel="noopener noreferrer"
        class="recommend-shop-btn"
      >
    ${item.shopLabel || '商品を見る'}
      </a>
    `;
  } else {
    links.innerHTML = '';
  }

  document.getElementById('recommend-modal').style.display = 'flex';
  document.body.style.overflow = 'hidden';
}

function closeRecommendModal() {
  document.getElementById('recommend-modal').style.display = 'none';
  document.body.style.overflow = '';
}
</script>
