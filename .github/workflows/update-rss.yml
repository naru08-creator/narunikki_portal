name: Update RSS articles

on:
  schedule:
    # 12:15 and 20:15 JST (UTC is 9 hours behind)
    - cron: '15 3,11 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-rss
  cancel-in-progress: false

jobs:
  update-rss:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fetch RSS and generate articles.json
        run: python scripts/update_rss.py

      - name: Commit updated JSON
        run: |
          if git diff --quiet -- articles.json; then
            echo "No RSS changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles.json
          git commit -m "Update RSS articles"
          git push
